# 推送后等 GitHub Pages 部署完成，再把网站地图里的网址提交给 IndexNow（Bing 等搜索引擎）
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.html'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to publish this sitemap
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "https://colasaiko.github.io/tuijianjichang/sitemap.xml?t=$i" | tr -d '\r' | cmp -s - <(tr -d '\r' < sitemap.xml); then
              echo "Live sitemap matches after $i tries"; exit 0
            fi
            sleep 15
          done
          echo "Live sitemap did not update in time; submitting anyway"

      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/\?loc>//g' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{
            host: "colasaiko.github.io",
            key: "6cfa194f9c7824b305d233ed204e1adc",
            keyLocation: "https://colasaiko.github.io/tuijianjichang/6cfa194f9c7824b305d233ed204e1adc.txt",
            urlList: $urls
          }' > payload.json
          cat payload.json
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "https://api.indexnow.org/IndexNow" -H 'Content-Type: application/json; charset=utf-8' --data @payload.json)
          echo "IndexNow responded $code"; cat response.txt
          case "$code" in 200|202) ;; *) exit 1 ;; esac
