<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title | default: "2026机场推荐 & Clash / VPN 资源导航" }}</title>
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    {% endif %}
    <link rel="stylesheet" href="/tuijianjichang/assets/css/style-v2.css?v=20260912-2">
    <style>
        /* Navbar geometry is intentionally fixed so page changes never resize it. */
        .navbar-wrapper {
            width: calc(100% - 32px);
        }
        .navbar-inner {
            flex-wrap: nowrap;
            height: 64px;
            min-height: 64px;
            max-height: 64px;
            overflow: hidden;
        }
        .nav-brand {
            flex: 0 0 auto;
            min-width: max-content;
        }
        .brand-title,
        .brand-subtitle,
        .nav-item {
            white-space: nowrap;
        }
        .nav-links {
            flex: 1 1 auto;
            min-width: 0;
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .nav-links::-webkit-scrollbar {
            display: none;
        }
        .nav-item,
        .nav-item.active,
        .nav-special {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            min-height: 36px;
            max-height: 36px;
            line-height: 1.2;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .navbar-wrapper {
                width: calc(100% - 20px);
            }
            .navbar-inner {
                height: 108px;
                min-height: 108px;
                max-height: 108px;
                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-start;
                overflow: hidden;
            }
            .nav-brand {
                width: 100%;
                min-width: 0;
                flex: 0 0 36px;
            }
            .nav-links {
                display: flex;
                width: 100%;
                flex: 0 0 40px;
                flex-wrap: nowrap;
            }
        }
    </style>

  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | replace: 'index.html', '' }}" />
  
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url | replace: 'index.html', '' }}" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/tuijianjichang-hero.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
  <meta name="twitter:description" content="{{ page.description | default: site.description }}" />
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/tuijianjichang-hero.jpg" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "description": "{{ site.description }}"
  }
  </script>

</head>
<body>
    <header class="navbar-wrapper">
        <div class="navbar-inner">
            <div class="nav-brand">
                <div class="brand-icon">🚀</div>
                <div class="brand-text">
                    <span class="brand-title">资源导航与教程中心</span>
                    <span class="brand-subtitle">Clash · VPN · 教程 · 资源</span>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/tuijianjichang/" class="nav-item {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">🏠 首页</a>
                <a href="/tuijianjichang/airport.html" class="nav-item {% if page.url == '/airport.html' %}active{% endif %}">✈️ 机场推荐</a>
                <a href="https://colasaiko.github.io/Clash-/" class="nav-item nav-special">⚡ Clash Guide</a>
                <a href="/tuijianjichang/clients.html" class="nav-item {% if page.url == '/clients.html' %}active{% endif %}">💻 客户端</a>
                <a href="https://colasaiko.github.io/NewbieRead/" class="nav-item">🛡️ 新手指南</a>
                <a href="/tuijianjichang/resources.html" class="nav-item {% if page.url == '/resources.html' %}active{% endif %}">🌐 资源库</a>
                <a href="https://colasaiko.github.io/About-My-Self/" class="nav-item">👤 关于我</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} 2026机场推荐 & Clash / VPN 资源导航. 持续维护更新中。</p>
        </div>
    </footer>
</body>
</html>
