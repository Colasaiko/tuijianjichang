<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title | default: "2026机场推荐 & Clash / VPN 资源导航" }}</title>
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    {% endif %}
    <link rel="stylesheet" href="/tuijianjichang/assets/css/style-v2.css">
    <style>
        /* Keep navbar geometry identical across pages and prevent label wrapping. */
        .navbar-inner {
            flex-wrap: nowrap;
            min-height: 62px;
        }
        .nav-brand {
            flex: 0 0 auto;
            min-width: max-content;
        }
        .brand-title,
        .brand-subtitle,
        .nav-item {
            white-space: nowrap;
        }
        .nav-links {
            flex: 1 1 auto;
            min-width: 0;
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .nav-links::-webkit-scrollbar {
            display: none;
        }
        .nav-item {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            line-height: 1.2;
        }
        @media (max-width: 768px) {
            .navbar-inner {
                min-height: 0;
            }
            .nav-brand {
                width: 100%;
                min-width: 0;
            }
            .nav-links {
                display: flex;
                width: 100%;
                flex-wrap: nowrap;
            }
        }
    </style>
</head>
<body>
    <header class="navbar-wrapper">
        <div class="navbar-inner">
            <div class="nav-brand">
                <div class="brand-icon">🚀</div>
                <div class="brand-text">
                    <span class="brand-title">资源导航与教程中心</span>
                    <span class="brand-subtitle">Clash · VPN · 教程 · 资源</span>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/tuijianjichang/" class="nav-item {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">🏠 首页</a>
                <a href="/tuijianjichang/airport.html" class="nav-item {% if page.url == '/airport.html' %}active{% endif %}">✈️ 机场推荐</a>
                <a href="https://colasaiko.github.io/Clash-/" class="nav-item nav-special">⚡ Clash Guide</a>
                <a href="/tuijianjichang/clients.html" class="nav-item {% if page.url == '/clients.html' %}active{% endif %}">💻 客户端</a>
                <a href="/tuijianjichang/newbie.html" class="nav-item {% if page.url == '/newbie.html' %}active{% endif %}">🛡️ 新手指南</a>
                <a href="/tuijianjichang/resources.html" class="nav-item {% if page.url == '/resources.html' %}active{% endif %}">🌐 资源库</a>
                <a href="https://colasaiko.github.io/About-My-Self/" class="nav-item">👤 关于我</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} 2026机场推荐 & Clash / VPN 资源导航. 持续维护更新中。</p>
        </div>
    </footer>
</body>
</html>
